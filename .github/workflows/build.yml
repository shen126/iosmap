   name: Build tweak

   on:
     workflow_dispatch:
     push:
       branches: [ main, master ]

   jobs:
     build:
       runs-on: macos-latest
       steps:
         - uses: actions/checkout@v4

         - name: Install tools
           run: brew install ldid make xz

         - name: Install Theos
           run: |
             git clone --quiet --recursive https://github.com/theos/theos.git "$HOME/theos"
             echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

         - name: Build (rootless)
           run: gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

         - name: Show result
           run: ls -la packages

         - uses: actions/upload-artifact@v4
           with:
             name: GoogleMapsNoDuck-deb
             path: packages/*.deb
